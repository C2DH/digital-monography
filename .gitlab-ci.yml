############# >>>>>>> IMPORTANT <<<<<< #############
####################################################
### UNCOMMENT AND FILL IN THE variables: BELOW ACCORDINGLY ###
### use "${DELIVERY_ASSUME_ROLE_ARN}" for AWS environment "DELIVERY"
### use "${ITSM_ASSUME_ROLE_ARN}" for AWS environment "ITSM"

variables:
  TF_VAR_assume_role_arn: "${ITSM_ASSUME_ROLE_ARN}"
  ENVIRONMENT_URL: "foo.degruyter.com"
  ENVIRONMENT_URL_TEST: "foo.test-deg.com"
