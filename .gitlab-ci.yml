stages:
  - init
  - build
  - deploy
  - destroy

init:
  stage: init
  only:
    - main
    - develop
  image: google/cloud-sdk
  before_script:
    - apt-get update && apt-get install -y curl gnupg jq
    - curl -qsL https://github.com/mozilla/sops/releases/download/v3.5.0/sops-v3.5.0.linux -o /usr/local/bin/sops
    - chmod +x /usr/local/bin/sops
    - cat $PGP_KEY | gpg --batch --import
    - echo $PGP_PASSPHRASE | gpg --batch --always-trust --yes --passphrase-fd 0 --pinentry-mode=loopback -s $(mktemp)
  script:
    - sops -d secrets/dev.tfvars.enc.json | jq '.data' > secrets/dev.tfvars.json
  artifacts:
    # expire_in: 1 day # TODO: consider TTL
    paths:
      - secrets/dev.tfvars.json

build:
  stage: init
  only:
    - main
    - develop
    # # Files get removed from s3 if build is not run
    # refs:
    #   - main
    #   - develop
    # changes:
    #   - "staticws/dashboard/*"
  image: node:20
  before_script:
    - cd staticws/nextjs/
    - npm install
    # - npm i -g pnpm
    # - pnpm i
  script:
    - npm run build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - staticws/nextjs/node_modules/
      - staticws/nextjs/.next/cache/
  artifacts:
    paths:
      - staticws/nextjs/.next
      - staticws/nextjs/out

deploy:
  stage: deploy
  dependencies:
    - init
    - build
  only:
    - main
    - develop
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - cp -a infra/. .
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - mkdir ~/.aws
    - echo -e "[profile oidc]\nrole_arn=${ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" >> ~/.aws/config
  script:
    - terraform init -var-file=secrets/dev.tfvars.json
    - terraform apply -auto-approve -var-file=secrets/dev.tfvars.json

destroy:
  stage: destroy
  only:
    - main
    - develop
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - cp -a infra/. .
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - mkdir ~/.aws
    - echo -e "[profile oidc]\nrole_arn=${ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" >> ~/.aws/config
  script:
    - terraform init -var-file=secrets/dev.tfvars.json -reconfigure
    - terraform destroy -auto-approve -var-file=secrets/dev.tfvars.json
  when: manual
