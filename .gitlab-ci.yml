stages:
  - init
  - deploy
  - post-deploy
  - destroy

init:
  stage: init
  only:
    - main
    - develop
  image: google/cloud-sdk
  before_script:
    - apt-get update && apt-get install -y curl gnupg jq
    - curl -qsL https://github.com/mozilla/sops/releases/download/v3.5.0/sops-v3.5.0.linux -o /usr/local/bin/sops
    - chmod +x /usr/local/bin/sops
    - cat $PGP_KEY | gpg --batch --import
    - echo $PGP_PASSPHRASE | gpg --batch --always-trust --yes --passphrase-fd 0 --pinentry-mode=loopback -s $(mktemp)
  script:
    - sops -d secrets/encrypted.tfvars.json | jq '.data' > secrets/decrypted.tfvars.json
    # - >
    #   sops -d secrets/encrypted.tfvars.json |
    #   jq -r --arg CI_COMMIT_BRANCH "$CI_COMMIT_BRANCH" '.data += {env: $CI_COMMIT_BRANCH}'
  artifacts:
    # expire_in: 1 day # TODO: consider TTL
    paths:
      - secrets/decrypted.tfvars.json

build-dashboard:
  stage: init
  # NOTE: make sure rules are in sync with upload-dashboard job
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - staticws/dashboard/**/*
  image: node:20
  before_script:
    - cd staticws/dashboard/
    - npm install
  script:
    - npm run build
  after_script:
    - ls -la staticws/dashboard/out
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - staticws/dashboard/node_modules/
      - staticws/dashboard/.next/cache/
  artifacts:
    untracked: true
    paths:
      - staticws/dashboard/.next
      - staticws/dashboard/out

deploy:
  stage: deploy
  dependencies:
    - init
    - build-dashboard
  only:
    - main
    - develop
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - cp -a infra/. .
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - mkdir ~/.aws
    - echo -e "[profile oidc]\nrole_arn=${ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" >> ~/.aws/config
  script:
    - terraform init -backend-config="key=statefile.tfstate" -var-file=secrets/decrypted.tfvars.json -var="env=$CI_COMMIT_BRANCH"
    - terraform apply -auto-approve -var-file=secrets/decrypted.tfvars.json -var="env=$CI_COMMIT_BRANCH"
    - terraform output -json > tf_output.json
  artifacts:
    expire_in: 1 day
    paths:
      - tf_output.json

upload-dashboard:
  stage: post-deploy
  dependencies:
    - build-dashboard
    - deploy
  # NOTE: make sure rules are in sync with build-dashboard job
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - staticws/dashboard/**/*
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - yum update -y && yum install -y jq
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - mkdir ~/.aws
    - echo -e "[profile oidc]\nrole_arn=${POST_DEPL_ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" >> ~/.aws/config
  script:
    - export STATICWS_DASHBOARD_S3=$(jq -r '.staticws_dashboard_bucket_name.value' tf_output.json)
    - export AWS_CONFIG_FILE=~/.aws/config
    - aws s3 sync staticws/dashboard/out s3://$STATICWS_DASHBOARD_S3 --delete --profile oidc
  when: on_success

destroy:
  stage: destroy
  only:
    - main
    - develop
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - cp -a infra/. .
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - mkdir ~/.aws
    - echo -e "[profile oidc]\nrole_arn=${ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" >> ~/.aws/config
  script:
    - terraform init -backend-config="key=statefile.tfstate" -var-file=secrets/decrypted.tfvars.json -var="env=$CI_COMMIT_BRANCH" -reconfigure
    - terraform destroy -auto-approve -var-file=secrets/decrypted.tfvars.json -var="env=$CI_COMMIT_BRANCH"
  when: manual
