stages:
  - init
  - deploy
  - post-deploy
  - destroy

init:
  stage: init
  only:
    - main
    - develop
  image: google/cloud-sdk
  before_script:
    - apt-get update && apt-get install -y curl gnupg jq
    - curl -qsL https://github.com/mozilla/sops/releases/download/v3.5.0/sops-v3.5.0.linux -o /usr/local/bin/sops
    - chmod +x /usr/local/bin/sops
    - cat $PGP_KEY | gpg --batch --import
    - echo $PGP_PASSPHRASE | gpg --batch --always-trust --yes --passphrase-fd 0 --pinentry-mode=loopback -s $(mktemp)
  script:
    - sops -d secrets/dev.tfvars.enc.json | jq '.data' > secrets/dev.tfvars.json
  artifacts:
    # expire_in: 1 day # TODO: consider TTL
    paths:
      - secrets/dev.tfvars.json

build-dashboard:
  stage: init
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - staticws/dashboard/**/*
  image: node:20
  before_script:
    - cd staticws/dashboard/
    - npm install
  script:
    - npm run build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - staticws/dashboard/node_modules/
      - staticws/dashboard/.next/cache/
  artifacts:
    paths:
      - staticws/dashboard/.next
      - staticws/dashboard/out

deploy:
  stage: deploy
  dependencies:
    - init
    - build-dashboard
  only:
    - main
    - develop
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - cp -a infra/. .
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - mkdir ~/.aws
    - echo -e "[profile oidc]\nrole_arn=${ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" >> ~/.aws/config
  script:
    - terraform init -var-file=secrets/dev.tfvars.json
    - terraform apply -auto-approve -var-file=secrets/dev.tfvars.json
    - terraform output -json > tf_output.json
  artifacts:
    expire_in: 1 day
    paths:
      - tf_output.json

upload-dashboard:
  stage: post-deploy
  dependencies:
    - build-dashboard
    - deploy
  only:
    - main
    - develop
  # NOTE: if amazon/aws-cli won't work...
  # image: python:3.12
  # before_script:
  #   - pip install awscli
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum update -y && yum install -y jq
  script:
    - echo tf_output.json
    - export STATICWS_DASHBOARD_S3=$(jq -r '.staticws_dashboard_bucket_name' tf_output.json)
    - echo STATICWS_DASHBOARD_S3
    - echo s3://$STATICWS_DASHBOARD_S3
    - aws --version
    - aws s3 sync staticws/dashboard/out s3://$STATICWS_DASHBOARD_S3 --delete
  when: on_success

destroy:
  stage: destroy
  only:
    - main
    - develop
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - cp -a infra/. .
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - mkdir ~/.aws
    - echo -e "[profile oidc]\nrole_arn=${ROLE_ARN}\nweb_identity_token_file=/tmp/web_identity_token" >> ~/.aws/config
  script:
    - terraform init -var-file=secrets/dev.tfvars.json -reconfigure
    - terraform destroy -auto-approve -var-file=secrets/dev.tfvars.json
  when: manual
