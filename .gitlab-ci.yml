stages:
  - init
  - deploy
  - post-deploy
  - e2e-tests
  - destroy

init:
  stage: init
  only:
    - main
    - develop
  image: google/cloud-sdk
  before_script:
    - echo "Step 1. Script preparation"
    - echo "Step 1.1. Install sops and jq"
    - apt-get update && apt-get install -y curl gnupg jq
    - curl -qsL https://github.com/mozilla/sops/releases/download/v3.5.0/sops-v3.5.0.linux -o /usr/local/bin/sops
    - chmod +x /usr/local/bin/sops
    - chmod +x scripts/sponge.awk
    - cat $PGP_KEY | gpg --batch --import
    - echo $PGP_PASSPHRASE | gpg --batch --always-trust --yes --passphrase-fd 0 --pinentry-mode=loopback -s $(mktemp)
  script:
    - echo "Step 2. Script execution"
    - echo "Step 2.1. Decrypt tfvars"
    - sops -d secrets/encrypted.tfvars.json | jq '.data' > secrets/decrypted.tfvars.json
    - |
      echo "Step 2.2. Set environment variables based on environment"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        export AWS_ACCOUNT_ID=$(jq -r '.aws_account_id_main' secrets/decrypted.tfvars.json)
        export DBX_APP_DIR=$(jq -r '.dropbox_app_dir_main' secrets/decrypted.tfvars.json)
        export DBX_APP_KEY=$(jq -r '.dropbox_app_key_main' secrets/decrypted.tfvars.json)
        export FLASK_SECRETK=$(jq -r '.flask_secret_key_main' secrets/decrypted.tfvars.json)
      elif [ "$CI_COMMIT_BRANCH" = "develop" ]; then
        export AWS_ACCOUNT_ID=$(jq -r '.aws_account_id_develop' secrets/decrypted.tfvars.json)
        export DBX_APP_DIR=$(jq -r '.dropbox_app_dir_develop' secrets/decrypted.tfvars.json)
        export DBX_APP_KEY=$(jq -r '.dropbox_app_key_develop' secrets/decrypted.tfvars.json)
        export FLASK_SECRETK=$(jq -r '.flask_secret_key_develop' secrets/decrypted.tfvars.json)
      else
        echo "hello"
      fi
    - |
      echo "Step 2.3. Update tfvars with environment-based variables"
      jq \
      --arg AWS_ACCOUNT_ID "$AWS_ACCOUNT_ID" \
      --arg DBX_APP_DIR "$DBX_APP_DIR" \
      --arg DBX_APP_KEY "$DBX_APP_KEY" \
      --arg FLASK_SECRETK "$FLASK_SECRETK" \
      '. += { "aws_account_id": $AWS_ACCOUNT_ID, "dropbox_app_dir": $DBX_APP_DIR, "dropbox_app_key": $DBX_APP_KEY, "flask_secret_key": $FLASK_SECRETK }' \
      secrets/decrypted.tfvars.json | ./scripts/sponge.awk secrets/decrypted.tfvars.json
    - echo "Step 2.4. Substitute values in infra/main.tf with environment-based variables"
    - export TFSTATE_LOCKTBL="dgtmon-$CI_COMMIT_BRANCH"'-'"$(jq -r '.tfstate_locktbl' secrets/decrypted.tfvars.json)"
    - export TFSTATE_BACKEND="dgtmon-$CI_COMMIT_BRANCH"'-'"$(jq -r '.tfstate_backend' secrets/decrypted.tfvars.json)"
    - sed -e 's@TFSTATE_LOCKTBL@'"$TFSTATE_LOCKTBL"'@' infra/main.tf | scripts/sponge.awk infra/main.tf
    - sed -e 's@TFSTATE_BACKEND@'"$TFSTATE_BACKEND"'@' infra/main.tf | scripts/sponge.awk infra/main.tf
    - cat infra/main.tf
  artifacts:
    # expire_in: 1 day # TODO: consider TTL
    paths:
      - secrets/decrypted.tfvars.json
  tags:
    - all

.build-dashboard:
  stage: init
  # NOTE: make sure rules are in sync with upload-dashboard job
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - staticws/dashboard/**/*
  image: node:20
  before_script:
    - cd staticws/dashboard/
    # - touch .env
    # - echo "NEXT_PUBLIC_GIT_BRANCH=${CI_COMMIT_BRANCH}" >> .env
    # - cat .env
    - npm install
  script:
    - npm run build:${CI_COMMIT_BRANCH}
  after_script:
    - ls -la staticws/dashboard/out
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - staticws/dashboard/node_modules/
      - staticws/dashboard/.next/cache/
  artifacts:
    untracked: true
    paths:
      - staticws/dashboard/.next
      - staticws/dashboard/out
  tags:
    - all

.deploy:
  stage: deploy
  dependencies:
    - init
    - build-dashboard
  only:
    - main
    - develop
  image:
    name: hashicorp/terraform:light
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - cp -a infra/. .
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - mkdir ~/.aws
    - echo -e "[profile oidc]\nrole_arn=${DGTMON_ROLE_DEPL_ARN}\nweb_identity_token_file=/tmp/web_identity_token" >> ~/.aws/config
  script:
    - terraform init -backend-config="key=${CI_COMMIT_BRANCH}.tfstate" -var-file=secrets/decrypted.tfvars.json -var="env=$CI_COMMIT_BRANCH" -reconfigure
    - terraform apply -auto-approve -var-file=secrets/decrypted.tfvars.json -var="env=$CI_COMMIT_BRANCH"
    - terraform output -json > tf_output.json
  artifacts:
    expire_in: 1 day
    paths:
      - tf_output.json
  tags:
    - all

.upload-dashboard:
  stage: post-deploy
  dependencies:
    - build-dashboard
    - deploy
  # NOTE: make sure rules are in sync with build-dashboard job
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      changes:
        - staticws/dashboard/**/*
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - yum update -y && yum install -y jq
    - echo "${GITLAB_OIDC_TOKEN}" > /tmp/web_identity_token
    - mkdir ~/.aws
    - echo -e "[profile oidc]\nrole_arn=${DGTMON_ROLE_POSTDEPL_ARN}\nweb_identity_token_file=/tmp/web_identity_token" >> ~/.aws/config
  script:
    - export STATICWS_DASHBOARD_S3=$(jq -r '.staticws_dashboard_bucket_name.value' tf_output.json)
    - export AWS_CONFIG_FILE=~/.aws/config
    - aws s3 sync staticws/dashboard/out s3://$STATICWS_DASHBOARD_S3 --delete --profile oidc
  when: on_success
  tags:
    - all

