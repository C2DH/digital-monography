[remote]
type = s3
provider = AWS
env_auth = false
access_key_id = YOUR_ACCESS_KEY
secret_access_key = YOUR_SECRET_ACCESS_KEY
endpoint =
acl = private
region = eu-central-1
location_constraint = eu-central-1

