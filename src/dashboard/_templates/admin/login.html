{% extends 'base.html' %}

{% block title %}Login{% endblock %}
{% block content %}


<form class="w-full max-w-sm" method="POST" action="{{ url_for('admin.login') }}">
    <div class="mb-4 w-75">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
            Username
        </label>
        <input
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            id="username" type="text" placeholder="Username">
    </div>
    <div class="mb-6 w-75">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
            Password
        </label>
        <input
            class="sshadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            id="password" type="password" placeholder="******************">
        <!-- <input
            class="shadow appearance-none border border-red-500 rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline"
            id="password" type="password" placeholder="******************"> -->
        <!-- <p class="text-red-500 text-xs italic">Please choose a password.</p> -->
    </div>
    <div class="flex items-center justify-between">
        <input
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
            type="submit" value="Sign In">
    </div>
</form>
<br />
<p class="inline-block align-baseline text-sm text-gray-400">
    In case of any issue or request, email the administrator.
</p>
{% endblock %}
