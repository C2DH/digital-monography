{% extends 'base.html' %}

{% block title %}Unauthorized access{% endblock %}

{% block content %}
<div class="text-center py-20">
    <h2 class="text-3xl font-bold text-gray-900 mb-4">You are not logged in</h2>
    <p class="text-gray-600 text-lg mb-6">Please log in to access.</p>
    <a href="{{ url_for('admin.login') }}"
        class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all shadow-sm">
        Sign in
    </a>
</div>
{% endblock %}
