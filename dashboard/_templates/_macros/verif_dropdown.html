{% macro verif_dropdown(title, status, description) %}
<li class="rounded-md border border-gray-200 bg-white">
    <details class="group p-3">
        <summary class="flex cursor-pointer list-none items-start justify-between gap-3">
            <div class="flex min-w-0 items-start gap-3">
                {% if status == True %}
                <span
                    class="mt-0.5 inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-emerald-100 text-emerald-700"
                    aria-hidden="true">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
                        <path d="M6 12.5l4 4L18 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                            stroke-linejoin="round"></path>
                    </svg>
                </span>
                {% elif status == False %}
                <span
                    class="mt-0.5 inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-rose-100 text-rose-700"
                    aria-hidden="true">
                    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none">
                        <path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                        </path>
                    </svg>
                </span>
                {% else %}
                <span
                    class="mt-0.5 inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-amber-100 text-amber-700"
                    aria-hidden="true">
                    <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" opacity="0.25"></circle>
                        <path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        </path>
                    </svg>
                </span>
                {% endif %}
                <div class="min-w-0">
                    <p class="text-sm font-semibold text-gray-900">{{ title }}</p>
                    <p
                        class="text-xs text-{{ 'emerald' if status == True else 'rose' if status == False else 'amber' }}-700">
                        {{ status }}</p>
                </div>
            </div>
        </summary>
        <p class="mt-2 pl-9 text-sm text-gray-600">
            {{ description }}
        </p>
    </details>
</li>
{% endmacro %}
